name: MGM son durum

on:
  schedule:
    - cron: "7,37 * * * *"   # 30 dakikada bir (MGM izni: 15-30 dk aralık)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mgm
  cancel-in-progress: false

jobs:
  al:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: MGM son durum çek
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          pip install requests
          python -u mgm.py
      - name: Depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mgm.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "MGM son durum güncellendi"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
